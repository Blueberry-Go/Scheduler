global:
  scrape_interval: 5s 
  evaluation_interval: 15s 

scrape_configs:
  - job_name: 'blueberry'
    # Metrics endpoint path (default is /metrics)
    # metrics_path: /metrics # Uncomment if your path is different

    # Target configuration
    static_configs:
      - targets: ['host.docker.internal:8080'] 
        # Use host.docker.internal to reach the host machine from the container.
        # Replace 8080 if your BlueBerry app runs on a different port.
        # If BlueBerry runs in another Docker container on the same network,
        # replace 'host.docker.internal:8080' with '<blueberry_service_name>:<port>'
